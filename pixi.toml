[project]
name = "slam"
version = "0.0.0"
description = "A simple slimmed down mono slam implementation"
authors = ["Geoffrey Daniels <geoff@gpdaniels.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
opencv = ">=4.10.0,<4.11"
g2o = ">=2019.11.23,<2019.12"
glfw = ">=3.4,<4"
eigen = ">=3.4.0,<3.5"
cmake = "3.26.4.*"
make = ">=4.3,<5"
libglu = ">=9.0.0,<9.1"
cxx-compiler = ">=1.7.0,<1.8"
mesa-libgl-cos7-x86_64 = ">=18.3.4,<18.4"
mesalib = ">=24.1.0,<24.2"

[tasks]
clean     = { depends-on = [],            cmd = ["rm", "-rf", "BUILD"] }
configure = { depends-on = [],            cmd = ["cmake", "-S .", "-B BUILD"], inputs = ["CMakeLists.txt"], outputs = ["BUILD/CMakeCache.txt", "BUILD/CMakeFiles/*"]}
build     = { depends-on = ["configure"], cmd = ["cmake", "--build", "BUILD"], inputs = ["CMakeLists.txt", "source/*"], outputs = ["BUILD/TEMP"]}
start     = { depends-on = ["build"],     cmd = ["BUILD/TEMP", "./videos/freiburgxyz_525.mp4", "525"]}
